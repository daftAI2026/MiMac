name: Release preview

on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and verify artifacts without creating a tag or release
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: mimac-release
  cancel-in-progress: false

jobs:
  release-preview:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Freeze release date in Asia/Shanghai
        id: release-date
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          release_date = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y.%m.%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"date={release_date}\n")
          PY

      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test release version planner and component profiles
        run: |
          python3 script/release_version_test.py
          python3 script/test_verify_release.py
          python3 script/test_build_voice_overlay.py
          python3 script/test_verify_app_bundle_frame.py
          python3 script/test_inspect_voice_report.py
          python3 script/test_acceptance_evidence.py
          python3 script/test_acceptance_observer.py
          python3 script/test_live_acceptance.py
          python3 script/test_live_acceptance_native.py

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Read all releases for tag planning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/mimac-releases.json"

      - name: Prepare release version
        id: version
        env:
          RELEASE_DATE: ${{ steps.release-date.outputs.date }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 script/release_version.py \
            --date "$RELEASE_DATE" \
            --build-number "$BUILD_NUMBER" \
            --existing-releases "$RUNNER_TEMP/mimac-releases.json"

      - name: Build native settings libraries
        run: script/build_native_settings.sh

      - name: Select core-only Siri component profile
        run: script/build_voice_overlay.sh core-only

      - name: Build macOS arm64 app
        run: go tool mygo build -platform darwin/arm64 -skip-dmg -skip-notarize

      - name: Build macOS amd64 app
        run: go tool mygo build -platform darwin/amd64 -skip-dmg -skip-notarize

      - name: Verify release identities and native bundle contents
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          ASSET_STEM: ${{ steps.version.outputs.asset_stem }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release"
          mkdir -p "$release_dir"
          for arch in arm64 amd64; do
            verify_args=("dist/darwin-$arch/MiMac.app" \
              --arch "$arch" --revision "$GITHUB_SHA" \
              --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER" \
              --component-profile core-only \
              --output "$release_dir/MiMac-${ASSET_STEM}-darwin-${arch}.json")
            python3 script/verify_release.py "${verify_args[@]}"
          done

      - name: Package apps and checksums
        env:
          ASSET_STEM: ${{ steps.version.outputs.asset_stem }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release"
          mkdir -p "$release_dir"
          arm64_zip="MiMac-${ASSET_STEM}-darwin-arm64.zip"
          amd64_zip="MiMac-${ASSET_STEM}-darwin-amd64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/darwin-arm64/MiMac.app "$release_dir/$arm64_zip"
          ditto -c -k --sequesterRsrc --keepParent dist/darwin-amd64/MiMac.app "$release_dir/$amd64_zip"
          cd "$release_dir"
          shasum -a 256 "$arm64_zip" "$amd64_zip" \
            "MiMac-${ASSET_STEM}-darwin-arm64.json" "MiMac-${ASSET_STEM}-darwin-amd64.json" > SHA256SUMS

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MiMac-${{ steps.version.outputs.asset_stem }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mimac-release/
          if-no-files-found: error
          retention-days: 7

      - name: Create draft preview release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.release_title }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release"
          cat > "$release_dir/RELEASE-NOTES.txt" <<'EOF'
          Preview build: ad hoc signed and not notarized; this is not a Developer ID distribution.

          Each architecture includes an identity manifest with versions, source revision, explicit component profile and binary/native-library checksums.
          This preview uses the core-only profile. A separate Siri glass profile requires the recorded private ABI host gate; its inclusion does not establish runtime compatibility on every Mac.
          EOF
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$release_dir/RELEASE-NOTES.txt" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            "$release_dir"/*.zip \
            "$release_dir"/*.json \
            "$release_dir/SHA256SUMS"
