name: Release preview

on:
  workflow_dispatch:
    inputs:
      preview_revision:
        description: Two-digit candidate number, starting at 00 for each day
        type: string
        required: true
        default: "00"
      build_only:
        description: Build and verify artifacts without creating a tag or release
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: mimac-release
  cancel-in-progress: false

jobs:
  release-preview:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Freeze release date in Asia/Shanghai
        id: release-date
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          release_date = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y.%m.%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"date={release_date}\n")
          PY

      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install DMG metadata dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/mimac-packaging-venv"
          "$RUNNER_TEMP/mimac-packaging-venv/bin/python" -m pip install --requirement script/requirements-packaging.txt
          echo "$RUNNER_TEMP/mimac-packaging-venv/bin" >> "$GITHUB_PATH"

      - name: Test release version planner and component profiles
        run: |
          python3 script/release_version_test.py
          python3 script/test_verify_release.py
          python3 script/test_build_audio_compat.py
          python3 script/test_package_audio_component.py
          python3 script/test_package_dmg.py
          python3 script/test_build_voice_overlay.py
          python3 script/test_native_display_compatibility.py
          python3 script/test_native_display_lifecycle.py
          python3 script/test_verify_app_bundle_frame.py
          python3 script/test_inspect_voice_report.py
          python3 script/test_acceptance_evidence.py
          python3 script/test_acceptance_observer.py
          python3 script/test_live_acceptance.py
          python3 script/test_live_acceptance_native.py
          python3 script/test_native_key_construction.py

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Test native first-install process queries
        env:
          MIMAC_APPINSTALL_NATIVE_FIXTURE: "1"
        run: |
          go test ./internal/platform/appinstall -run '^TestAppinstallNative(FreshTransactionQueriesMissingTarget|MissingDestinationIsNotRunning)$' -count=1 -timeout=30s

      - name: Read all releases for tag planning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/mimac-releases.json"

      - name: Prepare release version
        id: version
        env:
          RELEASE_DATE: ${{ steps.release-date.outputs.date }}
          BUILD_NUMBER: ${{ github.run_number }}
          PREVIEW_REVISION: ${{ inputs.preview_revision }}
        run: |
          python3 script/release_version.py \
            --date "$RELEASE_DATE" \
            --build-number "$BUILD_NUMBER" \
            --source-revision "$GITHUB_SHA" \
            --preview-revision "$PREVIEW_REVISION" \
            --existing-releases "$RUNNER_TEMP/mimac-releases.json"

      - name: Build native settings libraries
        run: script/build_native_settings.sh

      - name: Select core-only Siri component profile
        run: script/build_voice_overlay.sh core-only

      - name: Build system audio installers for both architectures
        run: |
          set -euo pipefail
          python3 script/package_audio_component.py --arch arm64
          python3 script/package_audio_component.py --arch amd64

      - name: Build macOS arm64 app
        run: go tool mygo build -platform darwin/arm64 -skip-dmg -skip-notarize

      - name: Build macOS amd64 app
        run: go tool mygo build -platform darwin/amd64 -skip-dmg -skip-notarize

      - name: Plan artifact names
        id: names
        run: |
          set -euo pipefail
          arm64="$(python3 script/release_naming.py stem arm64)"
          amd64="$(python3 script/release_naming.py stem amd64)"
          printf 'arm64=%s\namd64=%s\n' "$arm64" "$amd64" >> "$GITHUB_OUTPUT"

      - name: Verify release identities and native bundle contents
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          RELEASE_IDENTITY: ${{ steps.version.outputs.release_identity }}
          ARM64_STEM: ${{ steps.names.outputs.arm64 }}
          AMD64_STEM: ${{ steps.names.outputs.amd64 }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release/$RELEASE_IDENTITY"
          mkdir -p "$release_dir"
          for arch in arm64 amd64; do
            stem="$ARM64_STEM"
            if [[ "$arch" == amd64 ]]; then stem="$AMD64_STEM"; fi
            python3 script/verify_release.py "dist/darwin-$arch/MiMac.app" \
              --arch "$arch" --revision "$GITHUB_SHA" \
              --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER" --release-identity "$RELEASE_IDENTITY" \
              --component-profile core-only --output "$release_dir/$stem.json"
          done

      - name: Package apps, DMGs and checksums
        env:
          RELEASE_IDENTITY: ${{ steps.version.outputs.release_identity }}
          ARM64_STEM: ${{ steps.names.outputs.arm64 }}
          AMD64_STEM: ${{ steps.names.outputs.amd64 }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release/$RELEASE_IDENTITY"
          for arch in arm64 amd64; do
            stem="$ARM64_STEM"
            if [[ "$arch" == amd64 ]]; then stem="$AMD64_STEM"; fi
            bundle="dist/darwin-$arch/MiMac.app"
            ditto -c -k --sequesterRsrc --keepParent "$bundle" "$release_dir/$stem.zip"
            python3 script/package_dmg.py "$bundle" --output "$release_dir/$stem.dmg"
            hdiutil verify "$release_dir/$stem.dmg"
          done
          cd "$release_dir"
          shasum -a 256 "$ARM64_STEM.dmg" > "$ARM64_STEM.dmg.sha256"
          shasum -a 256 "$AMD64_STEM.dmg" > "$AMD64_STEM.dmg.sha256"
          shasum -a 256 "$ARM64_STEM.zip" "$ARM64_STEM.dmg" "$ARM64_STEM.json" \
            "$AMD64_STEM.zip" "$AMD64_STEM.dmg" "$AMD64_STEM.json" > "MiMacPreview.sha256"

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.release_identity }}
          path: ${{ runner.temp }}/mimac-release/
          if-no-files-found: error
          retention-days: 7

      - name: Create draft preview release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_IDENTITY: ${{ steps.version.outputs.release_identity }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release/$RELEASE_IDENTITY"
          cat > "$release_dir/RELEASE-NOTES.txt" <<'EOF'
          Preview build: ad hoc signed and not notarized; this is not a Developer ID distribution.

          Each architecture includes an identity manifest with versions, source revision, explicit component profile and binary/native-library checksums.
          This preview uses the core-only profile. A separate Siri glass profile requires the recorded private ABI host gate; its inclusion does not establish runtime compatibility on every Mac.
          EOF
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_IDENTITY" \
            --notes-file "$release_dir/RELEASE-NOTES.txt" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            "$release_dir"/*.zip \
            "$release_dir"/*.dmg \
            "$release_dir"/*.json \
            "$release_dir"/*.sha256
