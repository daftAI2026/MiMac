name: Release preview

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimac-release
  cancel-in-progress: false

jobs:
  release-preview:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Freeze release date in Asia/Shanghai
        id: release-date
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          release_date = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y.%m.%d")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"date={release_date}\n")
          PY

      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test release version planner
        run: python3 script/release_version_test.py

      - name: Test and vet
        run: |
          go test ./...
          go vet ./...

      - name: Read all releases for tag planning
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$RUNNER_TEMP/mimac-releases.json"

      - name: Prepare release version
        id: version
        env:
          RELEASE_DATE: ${{ steps.release-date.outputs.date }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 script/release_version.py \
            --date "$RELEASE_DATE" \
            --build-number "$BUILD_NUMBER" \
            --existing-releases "$RUNNER_TEMP/mimac-releases.json"

      - name: Build native settings libraries
        run: script/build_native_settings.sh

      - name: Build macOS arm64 app
        run: go tool mygo build -platform darwin/arm64 -skip-dmg -skip-notarize

      - name: Build macOS amd64 app
        run: go tool mygo build -platform darwin/amd64 -skip-dmg -skip-notarize

      - name: Verify native bundle contents
        run: |
          python3 script/verify_app_bundle.py dist/darwin-arm64/MiMac.app --arch arm64
          python3 script/verify_app_bundle.py dist/darwin-amd64/MiMac.app --arch amd64

      - name: Package apps and checksums
        env:
          ASSET_STEM: ${{ steps.version.outputs.asset_stem }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release"
          mkdir -p "$release_dir"
          arm64_zip="MiMac-${ASSET_STEM}-darwin-arm64.zip"
          amd64_zip="MiMac-${ASSET_STEM}-darwin-amd64.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/darwin-arm64/MiMac.app "$release_dir/$arm64_zip"
          ditto -c -k --sequesterRsrc --keepParent dist/darwin-amd64/MiMac.app "$release_dir/$amd64_zip"
          cd "$release_dir"
          shasum -a 256 "$arm64_zip" "$amd64_zip" > SHA256SUMS

      - name: Create draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TITLE: ${{ steps.version.outputs.release_title }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/mimac-release"
          cat > "$release_dir/RELEASE-NOTES.txt" <<'EOF'
          Preview build: ad hoc signed and not notarized; this is not a Developer ID distribution.
          EOF
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TITLE" \
            --notes-file "$release_dir/RELEASE-NOTES.txt" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            "$release_dir"/*.zip \
            "$release_dir/SHA256SUMS"
